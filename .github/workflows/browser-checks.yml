name: App integration and browser checks

on:
  push:
    branches: [main, v54-real-data-foundation, ary-push-v90, ary-repairs-v91, ary-security-v92, repairs-v104]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify client bundle matches source modules
        run: |
          cp client-repairs.js /tmp/ary-client-repairs-before.js
          node scripts/build-client-repairs.cjs
          cmp /tmp/ary-client-repairs-before.js client-repairs.js
      - name: Check API error and streaming body contracts
        run: node server/check-request-errors.mjs
      - name: Check local startup and original state retention
        run: node check-state-guard-v104.cjs
      - name: Check local recovery and storage failures
        run: node check-backups-v92.cjs
      - name: Check monthly lifecycle and investment service foundation
        run: |
          node check-monthly-model-v200.cjs
          node check-investment-history-v201.cjs
          node server/check-investment-readiness-v200.mjs
          node server/check-credit-score-v206.mjs
      - name: Check financial analysis calculations
        run: node check-analysis-v93.cjs
      - name: Check instant amount formatting and syntax
        run: |
          node --check daily-use-v197.js
          node --check personal-layout-v192.js
          node check-instant-model-v197.cjs
      - name: Check first-use guide and visit rotation
        run: node check-experience-v94.cjs
      - name: Check application integration
        run: node check-integration.cjs
      - name: Check real account adapter contracts
        run: node server/check-accounts-v83.cjs
      - name: Check assistant backend adapter with simulated transport
        run: node server/check-assistant.mjs
      - name: Check captcha server adapter with simulated transport
        run: node server/check-registration-v72.mjs
      - name: Check push server contracts with simulated transport
        run: node server/check-push-v90.mjs
      - name: Install browser test dependency
        if: ${{ !cancelled() }}
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Exercise new registration and contextual page hints
        if: ${{ !cancelled() }}
        run: node check-guide-unified-v177.cjs
      - name: Exercise contextual page hint geometry and themes
        if: ${{ !cancelled() }}
        run: node check-guide-layout-v185.cjs
      - name: Exercise desktop workspace, progress circle and simple first step
        if: ${{ !cancelled() }}
        run: node check-desktop-workspace-v186.cjs
      - name: Exercise assistant consent and session cancellation
        if: ${{ !cancelled() }}
        run: node check-assistant-browser-v185.cjs
      - name: Exercise click and modal regression
        if: ${{ !cancelled() }}
        run: node check-clicks-browser-v165.cjs
      - name: Exercise local backup controls
        if: ${{ !cancelled() }}
        run: node check-backups-browser-v92.cjs
      - name: Exercise analysis and net worth controls
        if: ${{ !cancelled() }}
        run: node check-analysis-browser-v93.cjs
      - name: Exercise compact headers and contextual guide on all devices
        if: ${{ !cancelled() }}
        run: node check-experience-browser-v94.cjs
      - name: Exercise original mobile welcome and bubble icons
        if: ${{ !cancelled() }}
        run: node check-mobile-welcome-v97.cjs
      - name: Check notification rules and browser behavior
        if: ${{ !cancelled() }}
        run: node check-notifications-v89.cjs
      - name: Exercise application in real browsers
        if: ${{ !cancelled() }}
        run: node check-browser.cjs
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-screenshots
          path: browser-results/
          retention-days: 7
          if-no-files-found: ignore

  account-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: ary_rls_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false pg@8.16.3
      - run: node server/check-account-rls-v83.mjs
        env:
          ARY_DISPOSABLE_RLS_TEST: 'yes'
          ARY_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-password@localhost:5432/ary_rls_test

      - run: node server/check-push-postgres-v90.mjs
        env:
          ARY_DISPOSABLE_RLS_TEST: 'yes'
          ARY_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-password@localhost:5432/ary_rls_test
  personal-layout:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: node check-personal-layout-v192.cjs
      - run: node check-onboarding-guide-v193.cjs

      - run: node check-daily-use-v197.cjs

      - run: node check-quick-payment-v199.cjs

      - run: node check-monthly-investments-v200.cjs
      - run: node check-investment-workspace-v201.cjs
      - run: node check-debt-entry-alert-v205.cjs
      - run: node check-compact-credit-v206.cjs
          node check-sync-layout-v207.cjs
