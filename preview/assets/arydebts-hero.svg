<g fill="#14213a" opacity=".96" filter="url(#soft)"><ellipse cx="180" cy="215" rx="160" ry="75"/><ellipse cx="290" cy="160" rx="150" ry="78"/><ellipse cx="95" cy="330" rx="145" ry="90"/></g>
