 <path d="M631 510c-42-47-65-84-69-121" fill="none" stroke="#fff" stroke-width="8" stroke-dasharray="22 20"/>
 <!-- house/car -->
 <g transform="translate(565 430)"><path d="M0 44l48-39 50 39v64H0z" fill="#fff7da" stroke="#ffbd58" stroke-width="4"/><path d="M-7 45L48 0l58 45" fill="none" stroke="#ff4b45" stroke-width="12"/><rect x="18" y="65" width="26" height="43" fill="#d76b43"/><rect x="58" y="60" width="24" height="22" fill="#62caff"/></g>
 <g transform="translate(625 530)"><path d="M0 22l18-21h52l19 21 12 7v29H-9V31z" fill="#f8fbff" stroke="#79dfff" stroke-width="3"/><circle cx="12" cy="59" r="11" fill="#18223b"/><circle cx="80" cy="59" r="11" fill="#18223b"/></g>
</g>
