<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760">
<defs>
 <radialGradient id="space"><stop stop-color="#153d7a"/><stop offset=".48" stop-color="#07162e"/><stop offset="1" stop-color="#020713"/></radialGradient>
 <radialGradient id="sun"><stop stop-color="#fffbd0"/><stop offset=".24" stop-color="#ffc95a"/><stop offset=".65" stop-color="#ff713e" stop-opacity=".55"/><stop offset="1" stop-color="#ff713e" stop-opacity="0"/></radialGradient>
 <linearGradient id="ocean" x2="1" y2="1"><stop stop-color="#15b8e8"/><stop offset=".45" stop-color="#0968ae"/><stop offset="1" stop-color="#063265"/></linearGradient>
 <linearGradient id="land" x2="1" y2="1"><stop stop-color="#52dd79"/><stop offset=".45" stop-color="#0e8f68"/><stop offset="1" stop-color="#07534d"/></linearGradient>
 <linearGradient id="road" x2="1"><stop stop-color="#faefbe"/><stop offset=".5" stop-color="#ffe68d"/><stop offset="1" stop-color="#ffc45e"/></linearGradient>
 <linearGradient id="arrow" y2="1"><stop stop-color="#ffdb36"/><stop offset=".45" stop-color="#ff6d2e"/><stop offset="1" stop-color="#f32845"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
 <clipPath id="globe"><circle cx="450" cy="350" r="242"/></clipPath>
</defs>
<rect width="900" height="760" fill="url(#space)"/>
<circle cx="650" cy="205" r="220" fill="url(#sun)"/>
<g opacity=".8" fill="#fff"><circle cx="92" cy="82" r="2"/><circle cx="180" cy="160" r="1.5"/><circle cx="735" cy="96" r="2"/><circle cx="814" cy="224" r="1.5"/><circle cx="510" cy="62" r="1.2"/></g>
