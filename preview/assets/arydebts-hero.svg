<g clip-path="url(#globe)">
 <rect x="190" y="100" width="520" height="500" fill="url(#ocean)"/>
 <path d="M250 225c48-69 128-82 180-44 34 25 48 70 26 105-22 35-64 43-83 83-21 45 7 103-26 131-48 40-113-3-128-59-13-49 22-78 6-120-12-32-1-66 25-96z" fill="url(#land)"/>
